name: spendwise_ai
description: "SpendWise AI — Mobile Financial Intelligence Client for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & REST API
  http: ^1.2.1

  # Secure JWT Storage (Android Keystore)
  flutter_secure_storage: ^9.2.2

  # Formatting & Localized Currency/Dates
  intl: ^0.19.0

  # AI Markdown Chat & Insight Rendering
  flutter_markdown: ^0.7.3

  # Icons & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
